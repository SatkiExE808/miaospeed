name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # needed for release creation on tag push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, suffix: linux-amd64 }
          - { goos: linux,   goarch: arm64, suffix: linux-arm64 }
          - { goos: darwin,  goarch: amd64, suffix: darwin-amd64 }
          - { goos: darwin,  goarch: arm64, suffix: darwin-arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -eux
          mkdir -p dist
          COMMIT=$(git rev-parse --short HEAD)
          COMPTIME=$(date -u +%s)
          BUILDCOUNT="${GITHUB_RUN_NUMBER}"

          # core variant
          go build -tags=core -trimpath \
            -ldflags "-s -w -X main.BRAND=miaospeed -X main.COMMIT=${COMMIT} -X main.BUILDCOUNT=${BUILDCOUNT} -X main.COMPILATIONTIME=${COMPTIME}" \
            -o dist/miaospeed-${{ matrix.suffix }} .

          # meta variant (clash.meta-based proxies)
          go build -tags=meta -trimpath \
            -ldflags "-s -w -X main.BRAND=miaospeed.meta -X main.COMMIT=${COMMIT} -X main.BUILDCOUNT=${BUILDCOUNT} -X main.COMPILATIONTIME=${COMPTIME}" \
            -o dist/miaospeed.meta-${{ matrix.suffix }} .

          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: miaospeed-${{ matrix.suffix }}
          path: dist/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
